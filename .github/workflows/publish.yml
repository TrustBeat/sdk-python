# Publishes trustbeat to PyPI on a version tag.
#
# This workflow lives at the root of TrustBeat/sdk-python (mirrored from
# eu-security-app sdk/python). It does NOT run in the monorepo — GitHub only
# executes workflows at the repository root.
#
# Auth: PyPI Trusted Publishing (OIDC) — no API token stored. Configure the
# trusted publisher once on PyPI: project "trustbeat" → Publishing → add
# GitHub publisher (owner: TrustBeat, repo: sdk-python, workflow: publish.yml).
name: Publish to PyPI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # required for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4.3.1

      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
        with:
          python-version: '3.12'

      - name: Verify tag matches package version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "tag=$tag pkg=$pkg"
          [ "$tag" = "$pkg" ] || { echo "::error::tag $tag != pyproject version $pkg"; exit 1; }

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build sdist + wheel
        run: |
          python -m pip install --upgrade build
          python -m build

      - name: Publish to PyPI
        # v1.12.3 shipped a twine that rejects Metadata-Version 2.5, which current
        # setuptools emits — it failed the 0.4.0 release with InvalidDistribution
        # after building the artifacts successfully. v1.14.2 accepts it.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2

      # Dogfood: qualified timestamp for the exact sdist+wheel just published.
      # Evidence step only — must never turn a completed publish red.
      - name: Anchor release artifacts (TrustBeat)
        continue-on-error: true
        uses: TrustBeat/anchor-action@a5eb4451717f36d7bd1b6142a473003031f27512  # v1.0.0
        with:
          api-key: ${{ secrets.TRUSTBEAT_API_KEY }}
          files: dist/*
          description: "trustbeat-python ${{ github.ref_name }}"
